<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>MONEY Miner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg:#05070a; --card:#11161c; --text:#f4f7fb; --muted:#9aa6b5; --green:#2fce4a; --blue:#1a6dff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,sans-serif; color:var(--text); background:#05070a; }
    .app { max-width:430px; margin:0 auto; min-height:100vh; padding:14px 14px 100px; }
    .page { display:none; } .page.on { display:block; }
    h1 { margin:4px 0 16px; font-size:24px; }

    .balance-card {
      background: linear-gradient(135deg, #1a6dff, #0a4dff);
      border-radius: 24px;
      padding: 36px 20px;
      text-align: center;
      color: white;
      margin-bottom: 20px;
    }
    .balance-amount { font-size: 52px; font-weight: 800; line-height:1; }
    .balance-label { font-size: 18px; opacity: 0.9; margin-top: 6px; }
    .balance-sub { font-size: 14px; opacity: 0.7; margin-top: 4px; }

    .action-row { display:flex; justify-content:space-around; margin:18px 0 8px; }
    .action-btn { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:13px; color:var(--muted); }
    .action-icon { width:56px; height:56px; background:#1a1f26; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; }

    .card { background:var(--card); border-radius:16px; padding:14px; margin-bottom:12px; }
    button.claim, button.btn { width:100%; padding:14px; border:0; border-radius:12px; background:var(--green); color:#06210c; font-weight:800; font-size:16px; }
    button.claim { font-size:18px; margin-top:10px; }
    .btn-small { background:var(--green); color:#06210c; border:0; border-radius:10px; padding:8px 14px; font-weight:700; }

    .task-item { display:flex; align-items:center; gap:12px; }
    .task-icon { width:48px; height:48px; background:#1a1f26; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:24px; }
    .task-info { flex:1; }

    .nav { position:fixed; left:0; right:0; bottom:0; display:flex; background:#05070a; border-top:1px solid #1a1f26; padding:10px 0 14px; }
    .nav button { flex:1; background:transparent; border:0; color:var(--muted); font-size:12px; display:flex; flex-direction:column; align-items:center; gap:4px; }
    .nav button.on { color:var(--green); }
    .nav .ico { font-size:22px; }

    #wheel { width:220px; height:220px; margin:16px auto; border-radius:50%; border:10px solid #f5c542; background:conic-gradient(#2fce4a 0 45deg, #1a5c2e 45deg 90deg, #f5c542 90deg 135deg, #1a5c2e 135deg 180deg, #2fce4a 180deg 225deg, #f5c542 225deg 270deg, #2fce4a 270deg 315deg, #1a5c2e 315deg 360deg); position:relative; transition:transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); }
    #wheel-inner { position:absolute; inset:40px; background:#11161c; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; }
  </style>
</head>
<body>
  <div class="app">
    <section id="home" class="page on">
      <div class="balance-card">
        <div class="balance-amount" id="balance">0.00</div>
        <div class="balance-label">MONEY</div>
        <div class="balance-sub">Mined so far</div>
      </div>

      <div class="action-row">
        <div class="action-btn"><div class="action-icon">⛏️</div><span>Mine</span></div>
        <div class="action-btn"><div class="action-icon">🎰</div><span>Earn</span></div>
        <div class="action-btn"><div class="action-icon">👥</div><span>Friends</span></div>
        <div class="action-btn"><div class="action-icon">📋</div><span>Tasks</span></div>
      </div>

      <div class="card" style="text-align:center">
        <div id="timer">Mining... 03:59:59</div>
        <button class="claim" id="claim" disabled>Claim 1 MONEY</button>
      </div>
    </section>

    <section id="earn" class="page">
      <h1>Earn</h1>
      <div class="card" style="text-align:center">
        <div id="wheel"><div id="wheel-inner">SPIN</div></div>
        <button class="btn" id="spin">Spin Wheel</button>
        <div id="spin-result" style="margin-top:12px;font-weight:700;min-height:24px;"></div>
      </div>
    </section>

    <section id="tasks" class="page">
      <h1>Tasks</h1>
      <div class="card task-item">
        <div class="task-icon">📺</div>
        <div class="task-info"><b>Watch Ads</b><div class="note">Earn bonus MONEY</div></div>
        <button class="btn-small" id="watch-ad">Watch</button>
      </div>
      <div class="card task-item">
        <div class="task-icon">👥</div>
        <div class="task-info"><b>Join Money Community</b><div class="note">+5 MONEY</div></div>
        <button class="btn-small go" data-url="https://t.me/moneycommunity">Join</button>
      </div>
      <div class="card task-item">
        <div class="task-icon">🔬</div>
        <div class="task-info"><b>Money Labs</b><div class="note">+5 MONEY</div></div>
        <button class="btn-small go" data-url="https://t.me/moneylabs">Join</button>
      </div>
    </section>

    <section id="friends" class="page">
      <h1>Friends</h1>
      <div class="card">
        <b>Your Invite Link</b>
        <div id="invite-link" style="word-break:break-all;margin:8px 0;color:var(--muted)"></div>
        <button class="btn" id="copy-invite">Copy Link</button>
      </div>
      <div class="card">
        <b>Referral Reward</b>
        <div>2 MONEY + 0.01 GRAM per friend</div>
        <div id="ref-count" style="margin-top:8px">0 available</div>
        <button class="btn" id="claim-ref" style="margin-top:8px" disabled>Claim Referrals</button>
      </div>
    </section>

    <section id="profile" class="page">
      <h1>Profile</h1>
      <div class="card">
        <div id="uname">Miner</div>
        <div id="tgid" style="color:var(--muted)"></div>
      </div>
    </section>
  </div>

  <nav class="nav">
    <button class="on" data-page="home"><span class="ico">⛏️</span>Mine</button>
    <button data-page="earn"><span class="ico">🎰</span>Earn</button>
    <button data-page="tasks"><span class="ico">📋</span>Tasks</button>
    <button data-page="friends"><span class="ico">👥</span>Friends</button>
    <button data-page="profile"><span class="ico">👤</span>Profile</button>
  </nav>

  <script>
    const CYCLE = 4 * 60 * 60 * 1000;
    const KEY = "money-miner-v2";
    const BOT = "moneytokenairdrop_bot";
    let startedAt = Date.now(), claimed = 0, bonus = 0, gram = 0, refs = 0, myId = "";

    const $ = id => document.getElementById(id);
    const save = () => localStorage.setItem(KEY, JSON.stringify({ startedAt, claimed, bonus, gram, refs }));
    const load = () => { try { const s = JSON.parse(localStorage.getItem(KEY) || "{}"); startedAt = s.startedAt || Date.now(); claimed = s.claimed || 0; bonus = s.bonus || 0; gram = s.gram || 0; refs = s.refs || 0; } catch(e){} };

    function remaining() { return Math.max(0, CYCLE - (Date.now() - startedAt)); }
    function format(ms) {
      const t = Math.floor(ms / 1000);
      return [Math.floor(t/3600), Math.floor((t%3600)/60), t%60].map(n => String(n).padStart(2,"0")).join(":");
    }

    function paint() {
      const left = remaining();
      const ready = left <= 0;
      $("timer").textContent = ready ? "Ready to claim!" : "Mining... " + format(left);
      $("claim").disabled = !ready;
      $("claim").textContent = ready ? "Claim 1 MONEY" : "Mining...";
      $("balance").textContent = (claimed + bonus).toFixed(2);
      $("ref-count").textContent = refs + " available";
      $("claim-ref").disabled = refs === 0;
    }

    load(); paint(); setInterval(paint, 1000);

    $("claim").onclick = () => {
      if (remaining() > 0) return;
      claimed += 1;
      startedAt = Date.now();
      save(); paint();
    };

    $("spin").onclick = () => {
      const prizes = [0.5, 1, 0.01, 2, 0, 0.5];
      const labels = ["0.5 MONEY", "1 MONEY", "0.01 GRAM", "2 MONEY", "Try again", "0.5 MONEY"];
      const i = Math.floor(Math.random() * prizes.length);
      $("wheel").style.transform = `rotate(${360*5 + i*60}deg)`;
      setTimeout(() => {
        $("spin-result").textContent = "You got: " + labels[i];
        if (labels[i].includes("MONEY")) bonus += prizes[i];
        if (labels[i].includes("GRAM")) gram += prizes[i];
        save(); paint();
      }, 4000);
    };

    $("watch-ad").onclick = () => {
      bonus += 0.5;
      save(); paint();
      alert("+0.5 MONEY from ad!");
    };

    document.querySelectorAll(".go").forEach(btn => {
      btn.onclick = () => {
        const url = btn.dataset.url;
        if (window.Telegram?.WebApp?.openTelegramLink) Telegram.WebApp.openTelegramLink(url);
        else window.open(url, "_blank");
        bonus += 5;
        save(); paint();
        btn.textContent = "Done";
        btn.disabled = true;
      };
    });

    document.querySelectorAll(".nav button").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".nav button").forEach(b => b.classList.remove("on"));
        document.querySelectorAll(".page").forEach(p => p.classList.remove("on"));
        btn.classList.add("on");
        $(btn.dataset.page).classList.add("on");
      };
    });

    try {
      const u = Telegram.WebApp.initDataUnsafe?.user;
      if (u) {
        myId = String(u.id);
        $("uname").textContent = u.first_name || "Miner";
        $("tgid").textContent = "ID " + myId;
        $("invite-link").textContent = `https://t.me/${BOT}?startapp=${myId}`;
      }
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    } catch(e) {}

    $("copy-invite").onclick = async () => {
      try {
        await navigator.clipboard.writeText($("invite-link").textContent);
        $("copy-invite").textContent = "Copied!";
        setTimeout(() => $("copy-invite").textContent = "Copy Link", 1500);
      } catch(e) {}
    };

    $("claim-ref").onclick = () => {
      bonus += refs * 2;
      gram += refs * 0.01;
      refs = 0;
      save(); paint();
    };
  </script>
</body>
</html>
